<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEUB Assignment Front Page - Creator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Only Cinzel font kept for the University Name, rest will use standard Times New Roman -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Times New Roman', Times, serif;
      /* Tech Agency Premium Color Grading */
      background: linear-gradient(135deg, #0b1120 0%, #1e3a8a 50%, #0369a1 100%);
      background-attachment: fixed;
      color: #1e293b;
      min-height: 100vh;
      overflow-x: hidden;
    }

    input, button, select {
      font-family: 'Times New Roman', Times, serif;
    }

    .app-container {
      display: grid;
      grid-template-columns: 460px 1fr;
      min-height: 100vh;
    }

    /* ========== CUSTOMIZED SIDEBAR ========== */
    .sidebar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 2.5rem 2rem;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 15px 0 50px rgba(0, 0, 0, 0.25);
      overflow-y: auto;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    /* Custom Scrollbar */
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .sidebar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Creator Badge (Moved to Top) */
    .creator-badge {
      margin-bottom: 1.5rem; 
      padding: 1rem;
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      text-align: center;
      font-size: 1rem;
      color: #475569;
    }
    .creator-badge span {
      display: block;
      font-weight: 800; /* Bold Name */
      color: #1e3a8a;
      font-size: 1.25rem;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 1rem;
    }

    label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
      letter-spacing: 0.2px;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="date"]:focus {
      border-color: #0284c7;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
      transform: translateY(-1px);
    }

    .option-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .option-pill {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
      padding: 0.5rem 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      transition: all 0.25s ease;
      user-select: none;
    }

    .option-pill input[type="radio"] {
      display: none;
    }

    .option-pill:hover {
      background: #f0f9ff;
      border-color: #bae6fd;
    }

    .option-pill:has(input:checked) {
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
    }

    .subject-pill {
      font-size: 0.85rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
    }

    /* Action Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }

    .btn {
      padding: 0.9rem 1.2rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: #1e3a8a;
      color: white;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
    }
    .btn-primary:hover { background: #1e40af; transform: translateY(-2px); }

    .btn-secondary {
      background: #0284c7;
      color: white;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }
    .btn-secondary:hover { background: #0369a1; transform: translateY(-2px); }
    
    .btn-accent {
      background: #10b981;
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    .btn-accent:hover { background: #059669; transform: translateY(-2px); }

    .btn-outline {
      background: transparent;
      border: 2px solid #cbd5e1;
      color: #334155;
    }
    .btn-outline:hover { background: #f8fafc; border-color: #94a3b8; }

    /* ========== PREVIEW STAGE ========== */
    .preview-stage {
      padding: 3rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      width: 100%;
    }

    .a4-page {
      width: 210mm;
      min-height: 297mm;
      height: 297mm;
      padding: 20mm 22mm;
      background: #ffffff;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-sizing: border-box;
      flex-shrink: 0;
      border-radius: 3px;
    }

    .univ-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
    }

    .univ-logo {
      width: 190px;
      height: auto;
      max-height: 190px;
      object-fit: contain;
      margin-bottom: 15px;
      background: transparent;
      mix-blend-mode: multiply;   
    }

    .univ-name {
      font-family: 'Cinzel', serif; /* Only this one uses Cinzel */
      font-size: 20.5pt;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 1.1px;
      line-height: 1.25;
      margin-top: 2px;
    }

    .univ-location {
      font-family: 'Times New Roman', Times, serif;
      font-size: 11pt;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-top: 5px;
      font-weight: 600;
    }

    .topic-section {
      text-align: center;
      margin: 26px 0 22px;
    }

    .decor-line {
      height: 2px;
      background: #0f172a;
      width: 100%;
    }

    .decor-line.top { margin-bottom: 15px; }
    .decor-line.bottom { margin-top: 15px; }

    .topic-title {
      font-family: 'Times New Roman', Times, serif;
      font-size: 19pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #000000;
      min-height: 28px;
      line-height: 1.3;
    }

    .info-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 0 6px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 175px 1fr;
      align-items: baseline;
      border-bottom: 1.5px dotted #cbd5e1;
      padding-bottom: 6px;
    }

    .info-label {
      font-family: 'Times New Roman', Times, serif;
      font-size: 14pt;
      font-weight: 700;
      color: #000000;
    }

    .info-value {
      font-family: 'Times New Roman', Times, serif;
      font-size: 14pt;
      color: #1e293b;
      word-break: break-word;
      min-height: 20px;
      font-weight: 500;
    }

    .sheet-footer {
      width: 100%;
      margin-top: auto;
      padding-top: 12px;
    }

    .footer-bar {
      height: 5px;
      background: linear-gradient(90deg, #1e3a8a, #059669, #dc2626);
      border-radius: 3px;
    }

    /* ========== MODERN AGENCY TOAST (POPUP) ========== */
    .toast-container {
      font-family: 'Times New Roman', Times, serif;
      position: fixed;
      top: 30px;
      right: -400px;
      background: #ffffff;
      color: #1e293b;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 9999;
      transition: right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.35);
      min-width: 320px;
      overflow: hidden;
      border-left: 5px solid #3b82f6;
    }
    .toast-container.show { right: 30px; }
    
    .toast-icon { font-size: 1.6rem; }
    
    .toast-content {
      display: flex;
      flex-direction: column;
    }
    .toast-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: #0f172a;
      margin-bottom: 2px;
    }
    .toast-msg {
      font-size: 0.95rem;
      color: #475569;
    }
    
    /* Animated Progress Bar */
    .toast-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: #3b82f6;
      width: 100%;
    }
    .toast-container.show .toast-progress {
      animation: toastProgress 3.5s linear forwards;
    }
    @keyframes toastProgress {
      from { width: 100%; }
      to { width: 0%; }
    }

    /* ========== RESPONSIVE ========== */
    @media screen and (max-width: 1024px) {
      .app-container { grid-template-columns: 1fr; display: flex; flex-direction: column; }
      .sidebar { max-height: none; border-right: none; border-bottom: 2px solid #e2e8f0; border-radius: 0; }
      .preview-stage { padding: 2rem 1rem; overflow-x: auto; justify-content: flex-start; }
      .a4-page { transform: scale(0.8); transform-origin: top left; margin-bottom: -59mm; }
    }
    @media screen and (max-width: 768px) {
      .a4-page { transform: scale(0.6); margin-bottom: -118mm; }
      .toast-container { top: 20px; right: -100%; width: 90%; }
      .toast-container.show { right: 5%; }
    }
    @media screen and (max-width: 480px) {
      .sidebar { padding: 1.5rem; }
      .form-row { grid-template-columns: 1fr; }
      .a4-page { transform: scale(0.42); margin-bottom: -172mm; }
    }

    /* ========== PRINT STYLES ========== */
    @media print {
      body { background: transparent !important; }
      .no-print { display: none !important; }
      .app-container { display: block; }
      .preview-stage { padding: 0; width: 100%; }
      .a4-page {
        box-shadow: none !important;
        margin: 0; width: 100%; height: 100%;
        transform: none !important; page-break-after: avoid;
      }
      .univ-logo { mix-blend-mode: normal !important; }
    }
  </style>
</head>
<body>
  
  <!-- Modern Agency Style Toast Notification -->
  <div id="toast" class="toast-container">
    <span class="toast-icon" id="toastIcon">✅</span>
    <div class="toast-content">
      <span class="toast-title" id="toastTitle">Success</span>
      <span class="toast-msg" id="toastMsg">Action completed successfully.</span>
    </div>
    <div class="toast-progress" id="toastProgress"></div>
  </div>

  <div class="app-container">
    <!-- Left Input Panel -->
    <aside class="sidebar no-print">
      
      <!-- Creator Badge Moved to Top -->
      <div class="creator-badge">
        Developed & Designed by
        <span><b>Sadia Zahan Jumu</b></span>
      </div>

      <form id="coverForm">

        <!-- ======================= -->
        <!-- BATCH AND DEPARTMENT -->
        <!-- ======================= -->
        
        <div class="form-group">
          <label>Select Department</label>
          <div class="option-group">
            <label class="option-pill"><input type="radio" name="deptChoice" value="CSE" checked> CSE</label>
            <label class="option-pill"><input type="radio" name="deptChoice" value="EEE"> EEE</label>
            <label class="option-pill"><input type="radio" name="deptChoice" value="English"> English</label>
            <label class="option-pill"><input type="radio" name="deptChoice" value="LLB"> LLB</label>
            <label class="option-pill"><input type="radio" name="deptChoice" value="BBA"> BBA</label>
          </div>
        </div>

        <div class="form-group">
          <label>Batch</label>
          <div class="option-group">
            <label class="option-pill"><input type="radio" name="batchSeasonChoice" value="Spring" checked> Spring</label>
            <label class="option-pill"><input type="radio" name="batchSeasonChoice" value="Fall"> Fall</label>
            <label class="option-pill"><input type="radio" name="batchSeasonChoice" value="Winter"> Winter</label>
          </div>
        </div>

        <!-- ======================= -->

        <!-- SELECT SUBJECT BOX (QUICK FILL) -->
        <div class="form-group" style="background: #f0f9ff; padding: 15px; border-radius: 10px; border: 1px solid #bae6fd;">
          <label style="color: #0369a1;">Select Subject (Quick Auto-Fill)</label>
          <div class="option-group">
            <label class="option-pill subject-pill" title="Discrete Mathematics">
              <input type="radio" name="subjectChoice" value="CSE-06131111" data-title="Discrete Mathematics" data-faculty="Mr. Pritom Paul">
              Discrete Math
            </label>
            <label class="option-pill subject-pill" title="Principles of Economics">
              <input type="radio" name="subjectChoice" value="ECO-03113203" data-title="Principles of Economics" data-faculty="Ms. Tunajjina Akter">
              Economics
            </label>
            <label class="option-pill subject-pill" title="Advanced Functional English">
              <input type="radio" name="subjectChoice" value="ENG-02321201" data-title="Advanced Functional English" data-faculty="Ms. Ahlam Binth Abdul Muhith">
              English
            </label>
            <label class="option-pill subject-pill" title="Calculus">
              <input type="radio" name="subjectChoice" value="MAT-05411101" data-title="Calculus" data-faculty="Mr. Rathindra Chandra Gope">
              Calculus
            </label>
            <label class="option-pill subject-pill" title="Fundamentals of Physics">
              <input type="radio" name="subjectChoice" value="PHY-05331201" data-title="Fundamentals of Physics" data-faculty="Mr. Muhammed Sakil Hussain">
              Physics
            </label>
            <label class="option-pill subject-pill" title="Bangladesh Studies">
              <input type="radio" name="subjectChoice" value="SSW-03141202" data-title="Bangladesh Studies" data-faculty="Mr. Abdullah Haris Pasha">
              BD Studies
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Assignment Topic / Title</label>
          <input type="text" id="inTopic">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Course Title</label>
            <input type="text" id="inCourseTitle">
          </div>
          <div class="form-group">
            <label>Course Code</label>
            <input type="text" id="inCourseCode">
          </div>
        </div>

        <div class="form-group">
          <label>Faculty / Instructor Name</label>
          <input type="text" id="inFaculty">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="inStudentName">
          </div>
          <div class="form-group">
            <label>Student ID</label>
            <input type="text" id="inStudentID">
          </div>
        </div>

        <div class="form-group">
          <label>Submission Date</label>
          <input type="date" id="inDate">
        </div>

        <div class="actions">
          <label style="margin-bottom: -2px;">Download Formats</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <button type="button" id="downloadPngBtn" class="btn btn-primary">📸 PNG Image</button>
            <button type="button" id="downloadJpgBtn" class="btn btn-accent">🖼️ JPG Image</button>
          </div>
          <button type="button" id="downloadPdfBtn" class="btn btn-secondary">📄 PDF Document</button>
          <button type="button" onclick="window.print()" class="btn btn-outline">🖨️ Direct Print</button>
        </div>

      </form>
    </aside>

    <!-- Right Live Preview -->
    <main class="preview-stage">
      <div id="pageToRender" class="a4-page">
        <header class="univ-header">
          <img src="logo.jpeg" 
               alt="NEUB Logo" 
               class="univ-logo" 
               id="previewLogo">
          
          <h1 class="univ-name">NORTH EAST UNIVERSITY BANGLADESH</h1>
          <p class="univ-location"><b>Sylhet, Bangladesh</b></p>
        </header>

        <div class="topic-section">
          <div class="decor-line top"></div>
          <h2 id="outTopic" class="topic-title"></h2>
          <div class="decor-line bottom"></div>
        </div>

        <div class="info-grid">
          <div class="info-row">
            <span class="info-label">Student Name:</span>
            <span class="info-value" id="outStudentName"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Student ID:</span>
            <span class="info-value" id="outStudentID"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Course Title:</span>
            <span class="info-value" id="outCourseTitle"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Course Code:</span>
            <span class="info-value" id="outCourseCode"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Faculty:</span>
            <span class="info-value" id="outFaculty"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Department:</span>
            <span class="info-value" id="outDepartment">CSE</span>
          </div>
          <div class="info-row">
            <span class="info-label">Batch:</span>
            <span class="info-value" id="outBatch">Spring</span>
          </div>
          <div class="info-row">
            <span class="info-label">Submission Date:</span>
            <span class="info-value" id="outDate"></span>
          </div>
        </div>

        <footer class="sheet-footer">
          <div class="footer-bar"></div>
        </footer>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      let toastTimeout;
      // Modern Tech Toast Controller
      function showToast(title, message, type = "success") {
        const toast = document.getElementById('toast');
        const toastTitle = document.getElementById('toastTitle');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');
        const toastProgress = document.getElementById('toastProgress');
        
        toastTitle.innerText = title;
        toastMsg.innerText = message;
        
        // Reset animation
        toastProgress.style.animation = 'none';
        toastProgress.offsetHeight; 
        
        if (type === "success") {
          toastIcon.innerText = "✅";
          toast.style.borderLeftColor = "#10b981";
          toastProgress.style.background = "#10b981";
        } else if (type === "loading") {
          toastIcon.innerText = "⏳";
          toast.style.borderLeftColor = "#3b82f6";
          toastProgress.style.background = "#3b82f6";
        } else {
          toastIcon.innerText = "❌";
          toast.style.borderLeftColor = "#ef4444";
          toastProgress.style.background = "#ef4444";
        }

        toast.classList.add('show');
        
        if(type !== "loading") {
          toastProgress.style.animation = 'toastProgress 3.5s linear forwards';
          clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3500);
        } else {
          toastProgress.style.width = '100%';
        }
      }

      function hideToast() {
        document.getElementById('toast').classList.remove('show');
      }

      const textFields = [
        { inId: 'inTopic', outId: 'outTopic' },
        { inId: 'inStudentName', outId: 'outStudentName' },
        { inId: 'inStudentID', outId: 'outStudentID' },
        { inId: 'inCourseTitle', outId: 'outCourseTitle' },
        { inId: 'inCourseCode', outId: 'outCourseCode' },
        { inId: 'inFaculty', outId: 'outFaculty' }
      ];

      // ==========================================
      // CORRECT BANGLADESH DATE (BST: UTC+6) SETUP
      // ==========================================
      const bdDateOptions = { timeZone: 'Asia/Dhaka' };
      
      const bdYear = new Intl.DateTimeFormat('en-US', { ...bdDateOptions, year: 'numeric' }).format(new Date());
      const bdMonth = new Intl.DateTimeFormat('en-US', { ...bdDateOptions, month: '2-digit' }).format(new Date());
      const bdDay = new Intl.DateTimeFormat('en-US', { ...bdDateOptions, day: '2-digit' }).format(new Date());
      
      const todayISO = `${bdYear}-${bdMonth}-${bdDay}`;
      const dateInput = document.getElementById('inDate');
      dateInput.value = todayISO;

      // Formatting for the Preview Page
      function updatePreviewDate(dateString) {
        if(!dateString) return;
        const d = new Date(dateString);
        if (!isNaN(d)) {
          const prettyDate = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }).format(d);
          document.getElementById('outDate').innerText = prettyDate;
        } else {
          document.getElementById('outDate').innerText = dateString;
        }
      }
      
      updatePreviewDate(todayISO);
      dateInput.addEventListener('change', (e) => updatePreviewDate(e.target.value));

      // Map Other Text Inputs
      textFields.forEach(({ inId, outId }) => {
        const inputElem = document.getElementById(inId);
        const outElem = document.getElementById(outId);
        if (inputElem && outElem) {
          inputElem.addEventListener('input', (e) => {
            outElem.innerText = e.target.value;
          });
        }
      });

      // Quick Fill Subject
      document.querySelectorAll('input[name="subjectChoice"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          if (e.target.checked) {
            const courseCode = e.target.value;
            const courseTitle = e.target.getAttribute('data-title');
            const facultyName = e.target.getAttribute('data-faculty');

            document.getElementById('inCourseCode').value = courseCode;
            document.getElementById('inCourseTitle').value = courseTitle;
            document.getElementById('inFaculty').value = facultyName;

            document.getElementById('outCourseCode').innerText = courseCode;
            document.getElementById('outCourseTitle').innerText = courseTitle;
            document.getElementById('outFaculty').innerText = facultyName;

            showToast("Auto-Filled!", "Course details have been successfully applied.", "success");
          }
        });
      });

      // Dept
      function updateDepartment() {
        const selected = document.querySelector('input[name="deptChoice"]:checked');
        if (selected) document.getElementById('outDepartment').innerText = selected.value;
      }
      document.querySelectorAll('input[name="deptChoice"]').forEach(el => el.addEventListener('change', updateDepartment));

      // Batch
      function updateBatch() {
        const selectedSeason = document.querySelector('input[name="batchSeasonChoice"]:checked');
        const season = selectedSeason ? selectedSeason.value : '';

        document.getElementById('outBatch').innerText = season;
      }
      document.querySelectorAll('input[name="batchSeasonChoice"]').forEach(el => el.addEventListener('change', updateBatch));

      updateDepartment();
      updateBatch();

      // Reliable Capture Function
      async function capturePage(scaleMultiplier = 3) {
        window.scrollTo(0, 0);
        const pageElement = document.getElementById('pageToRender');
        
        const originalTransform = pageElement.style.transform;
        pageElement.style.transform = 'none';

        try {
          const canvas = await html2canvas(pageElement, {
            scale: scaleMultiplier, 
            useCORS: true,
            allowTaint: false,
            logging: false,
            backgroundColor: '#ffffff'
          });
          return canvas;
        } finally {
          pageElement.style.transform = originalTransform; 
        }
      }

      // Download Handler
      async function handleDownload(format) {
        const btnId = format === 'PDF' ? 'downloadPdfBtn' : (format === 'PNG' ? 'downloadPngBtn' : 'downloadJpgBtn');
        const btn = document.getElementById(btnId);
        const originalText = btn.innerHTML;
        const stdId = document.getElementById('inStudentID').value.trim() || 'Assignment';
        
        btn.innerHTML = '⏳ Processing...';
        btn.disabled = true;
        showToast("Processing...", `Generating high-quality ${format} file.`, "loading");

        try {
          const canvas = await capturePage(3);

          if (format === 'PDF') {
            const { jsPDF } = window.jspdf;
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            
            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(`NEUB_Cover_${stdId}.pdf`);

          } else {
            const link = document.createElement('a');
            link.download = `NEUB_Cover_${stdId}.${format.toLowerCase()}`;
            link.href = canvas.toDataURL(`image/${format.toLowerCase() === 'jpg' ? 'jpeg' : 'png'}`, 1.0);
            link.click();
          }

          hideToast();
          setTimeout(() => showToast("Success!", `${format} Downloaded Successfully!`, "success"), 200);

        } catch (err) {
          console.error(`${format} Download Error:`, err);
          hideToast();
          setTimeout(() => {
            showToast("Error!", `Failed to generate document. Please try running in a Local Server.`, "error");
          }, 200);
        } finally {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      }

      document.getElementById('downloadPngBtn').addEventListener('click', () => handleDownload('PNG'));
      document.getElementById('downloadJpgBtn').addEventListener('click', () => handleDownload('JPG'));
      document.getElementById('downloadPdfBtn').addEventListener('click', () => handleDownload('PDF'));

    });
  </script>
</body>
</html>
