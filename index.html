<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEUB Assignment Front Page - Premium Dark Glass</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      /* =========================================
         PERMANENT DARK MODE (Premium Midnight Indigo) 
         ========================================= */
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
      
      --glass-bg: rgba(15, 23, 42, 0.6);
      --glass-border: rgba(255, 255, 255, 0.25); 
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
      --glass-blur: blur(16px);
      
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-label: #e2e8f0;
      
      --input-bg: rgba(0, 0, 0, 0.4);
      --input-border: rgba(255, 255, 255, 0.3);
      --input-focus: #818cf8;
      
      --badge-text: #818cf8;
      
      --pill-bg: rgba(0, 0, 0, 0.4);
      --pill-hover: rgba(255, 255, 255, 0.15);
      --pill-active-bg: linear-gradient(135deg, #6366f1, #3b82f6);
      --pill-active-text: white;
      
      --subject-box-title: #818cf8;
      --transition-speed: 0.3s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Times New Roman', Times, serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    input, button, select { font-family: 'Times New Roman', Times, serif; }

    .app-container {
      display: grid;
      grid-template-columns: 460px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ========== FULL GLASS SIDEBAR ========== */
    .sidebar {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 1.5rem; 
      border-right: 1.5px solid var(--glass-border); /* Sharp Border */
      box-shadow: var(--glass-shadow);
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 10;
      overflow-y: auto;
    }

    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

    /* ========== CREATOR BADGE (UPDATED: BIG & BOLD) ========== */
    .creator-badge {
      width: 100%;
      margin-bottom: 1.5rem;
      padding: 1.2rem 1rem; /* Increased padding */
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 12px;
      border: 2px solid var(--glass-border); /* Thicker Sharp Border */
      box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.7); /* Deeper Shadow */
      text-align: center;
      font-size: 1.05rem; /* Larger sub-text */
      font-weight: 700; /* Bold sub-text */
      color: #e2e8f0; /* Brighter color */
    }
    .creator-badge span {
      display: block;
      font-weight: 900; /* Extra Bold Name */
      color: #a5b4fc; /* Premium light indigo color */
      font-size: 1.6rem; /* Much Larger Name */
      margin-top: 6px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(99, 102, 241, 0.5); /* Subtle Neon Glow */
    }

    /* ========== FORM ELEMENTS ========== */
    .form-group { margin-bottom: 0.8rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-label);
      margin-bottom: 0.3rem;
      letter-spacing: 0.2px;
    }

    /* Glass Inputs */
    input[type="text"], input[type="date"] {
      width: 100%;
      padding: 0.5rem 0.8rem; 
      border: 1.5px solid var(--input-border); /* Sharp Border */
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
      transition: all var(--transition-speed) ease;
    }

    input[type="text"]:focus, input[type="date"]:focus {
      border-color: var(--input-focus);
      background: var(--glass-bg);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
      transform: translateY(-1px);
    }

    .option-group { display: flex; flex-wrap: wrap; gap: 0.4rem; }

    /* Glass Pills */
    .option-pill {
      display: inline-flex; align-items: center; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; color: var(--text-main);
      padding: 0.4rem 0.65rem; border: 1.5px solid var(--glass-border); /* Sharp Border */
      border-radius: 8px; background: var(--pill-bg);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      transition: all 0.25s ease; user-select: none;
    }
    .option-pill input[type="radio"] { display: none; }
    .option-pill:hover { background: var(--pill-hover); transform: translateY(-1px); }
    .option-pill:has(input:checked) {
      background: var(--pill-active-bg); color: var(--pill-active-text);
      border-color: transparent; box-shadow: 0 4px 12px var(--glass-shadow); transform: scale(1.02);
    }

    /* Glass Subject Box */
    .subject-box {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid var(--glass-border); /* Sharp Border */
      box-shadow: var(--glass-shadow);
    }

    .subject-pill { font-size: 0.8rem; padding: 0.35rem 0.6rem; }

    /* Action Buttons */
    .actions { display: flex; flex-direction: column; gap: 0.6rem; margin-top: auto; padding-top: 15px; }
    .btn { padding: 0.65rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; border: none; transition: all var(--transition-speed) ease; display: flex; align-items: center; justify-content: center; gap: 6px; }
    
    .btn-primary { background: linear-gradient(135deg, #4f46e5, #3b82f6); color: white; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6); }
    .btn-secondary { background: linear-gradient(135deg, #0284c7, #0ea5e9); color: white; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6); }
    .btn-accent { background: linear-gradient(135deg, #059669, #10b981); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
    .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6); }
    
    .btn-outline { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1.5px solid var(--glass-border); color: var(--text-main); }
    .btn-outline:hover { background: var(--input-bg); }

    /* ========== PREVIEW STAGE ========== */
    .preview-stage {
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      width: 100%;
      height: 100vh;
    }

    .a4-page {
      width: 210mm;
      min-height: 297mm;
      height: 297mm;
      padding: 20mm 22mm;
      background: #ffffff;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-sizing: border-box;
      flex-shrink: 0;
      border-radius: 2px;
      color: #000000; /* Strict Black text for the printable page */
    }

    .univ-header { text-align: center; display: flex; flex-direction: column; align-items: center; margin-bottom: 8px; }
    .univ-logo { width: 190px; height: auto; max-height: 190px; object-fit: contain; margin-bottom: 12px; background: transparent; mix-blend-mode: multiply; }
    .univ-name { font-family: 'Cinzel', serif; font-size: 20.5pt; font-weight: 800; color: #000000; letter-spacing: 1.1px; line-height: 1.25; margin-top: 2px; }
    .univ-location { font-family: 'Times New Roman', Times, serif; font-size: 11pt; color: #333333; text-transform: uppercase; letter-spacing: 2.5px; margin-top: 5px; font-weight: 600; }
    .univ-dept { font-family: 'Times New Roman', Times, serif; font-size: 15pt; font-weight: 700; color: #000000; margin-top: 10px; letter-spacing: 0.5px; text-transform: uppercase; }

    .topic-section { text-align: center; margin: 24px 0 20px; }
    .decor-line { height: 2px; background: #000000; width: 100%; }
    .decor-line.top { margin-bottom: 15px; }
    .decor-line.bottom { margin-top: 15px; }
    .topic-title { font-family: 'Times New Roman', Times, serif; font-size: 19pt; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #000000; min-height: 28px; line-height: 1.3; }

    .info-grid { display: flex; flex-direction: column; gap: 15px; padding: 0 6px; }
    .info-row { display: grid; grid-template-columns: 185px 1fr; align-items: baseline; border-bottom: 1.5px dotted #cbd5e1; padding-bottom: 6px; }
    .info-label { font-family: 'Times New Roman', Times, serif; font-size: 14pt; font-weight: 700; color: #000000; }
    .info-value { font-family: 'Times New Roman', Times, serif; font-size: 14pt; color: #1e293b; word-break: break-word; min-height: 20px; font-weight: 500; }

    .sheet-footer { width: 100%; margin-top: auto; padding-top: 12px; }
    .footer-bar { height: 5px; background: linear-gradient(90deg, #1e3a8a, #059669, #dc2626); border-radius: 3px; }

    /* ========== FULL GLASS TOAST (POPUP) ========== */
    .toast-container {
      font-family: 'Times New Roman', Times, serif; position: fixed; top: 30px; right: -400px;
      background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      color: var(--text-main); padding: 16px 20px; border-radius: 12px;
      box-shadow: var(--glass-shadow); border: 1.5px solid var(--glass-border);
      display: flex; align-items: center; gap: 15px; z-index: 9999; 
      transition: right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.35); min-width: 320px; overflow: hidden;
      border-left: 5px solid #6366f1;
    }
    .toast-container.show { right: 30px; }
    .toast-icon { font-size: 1.6rem; }
    .toast-content { display: flex; flex-direction: column; }
    .toast-title { font-weight: 700; font-size: 1.1rem; color: var(--text-main); margin-bottom: 2px; }
    .toast-msg { font-size: 0.95rem; color: var(--text-muted); }
    .toast-progress { position: absolute; bottom: 0; left: 0; height: 4px; background: #6366f1; width: 100%; }
    .toast-container.show .toast-progress { animation: toastProgress 3.5s linear forwards; }
    @keyframes toastProgress { from { width: 100%; } to { width: 0%; } }

    /* ========== RESPONSIVE ========== */
    @media screen and (max-width: 1024px) {
      .app-container { grid-template-columns: 1fr; display: flex; flex-direction: column; height: auto; overflow: visible; }
      .sidebar { height: auto; border-right: none; border-bottom: 1.5px solid var(--glass-border); }
      .preview-stage { padding: 2rem 1rem; overflow-x: auto; justify-content: flex-start; height: auto; }
      .a4-page { transform: scale(0.8); transform-origin: top left; margin-bottom: -59mm; }
    }
    @media screen and (max-width: 768px) {
      .a4-page { transform: scale(0.6); margin-bottom: -118mm; }
      .toast-container { top: 20px; right: -100%; width: 90%; }
      .toast-container.show { right: 5%; }
    }
    @media screen and (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
      .a4-page { transform: scale(0.42); margin-bottom: -172mm; }
    }

    /* ========== PRINT STYLES ========== */
    @media print {
      body { background: #ffffff !important; }
      .no-print { display: none !important; }
      .app-container { display: block; height: auto; overflow: visible; }
      .preview-stage { padding: 0; width: 100%; height: auto; overflow: visible; }
      .a4-page { box-shadow: none !important; margin: 0; width: 100%; height: 100%; transform: none !important; page-break-after: avoid; background: #ffffff !important; color: #000000 !important; }
      .univ-logo { mix-blend-mode: normal !important; }
    }
  </style>
</head>
<body>
  
  <!-- Glass Toast -->
  <div id="toast" class="toast-container">
    <span class="toast-icon" id="toastIcon">✅</span>
    <div class="toast-content">
      <span class="toast-title" id="toastTitle">Success</span>
      <span class="toast-msg" id="toastMsg">Action completed successfully.</span>
    </div>
    <div class="toast-progress" id="toastProgress"></div>
  </div>

  <div class="app-container">
    <!-- Left Glass Panel -->
    <aside class="sidebar no-print">
      
      <!-- Creator Badge -->
      <div class="creator-badge">
        Developed & Designed by
        <span>Sadia Zahan Jumu</span>
      </div>

      <form id="coverForm">

        <div class="form-group">
          <label>Select Department</label>
          <div class="option-group">
            <label class="option-pill"><input type="radio" name="deptChoice" value="CSE" checked> CSE</label>
            <label class="option-pill"><input type="radio" name="deptChoice" value="EEE"> EEE</label>
            <label class="option-pill"><input type="radio" name="deptChoice" value="English"> English</label>
            <label class="option-pill"><input type="radio" name="deptChoice" value="LLB"> LLB</label>
            <label class="option-pill"><input type="radio" name="deptChoice" value="BBA"> BBA</label>
          </div>
        </div>

        <!-- ======================= -->
        <!-- QUICK FILL SUBJECTS (FULL NAMES) -->
        <!-- ======================= -->
        <div class="form-group subject-box">
          <label style="color: var(--subject-box-title); margin-bottom: 8px;">Select Subject (Quick Auto-Fill)</label>
          <div class="option-group">
            <label class="option-pill subject-pill" title="Discrete Mathematics">
              <input type="radio" name="subjectChoice" value="CSE-06131111" data-title="Discrete Mathematics" data-faculty="Mr. Pritom Paul"> Discrete Mathematics
            </label>
            <label class="option-pill subject-pill" title="Principles of Economics">
              <input type="radio" name="subjectChoice" value="ECO-03113203" data-title="Principles of Economics" data-faculty="Ms. Tunajjina Akter"> Principles of Economics
            </label>
            <label class="option-pill subject-pill" title="Advanced Functional English">
              <input type="radio" name="subjectChoice" value="ENG-02321201" data-title="Advanced Functional English" data-faculty="Ms. Ahlam Binth Abdul Muhith"> Advanced Functional English
            </label>
            <label class="option-pill subject-pill" title="Calculus">
              <input type="radio" name="subjectChoice" value="MAT-05411101" data-title="Calculus" data-faculty="Mr. Rathindra Chandra Gope"> Calculus
            </label>
            <label class="option-pill subject-pill" title="Fundamentals of Physics">
              <input type="radio" name="subjectChoice" value="PHY-05331201" data-title="Fundamentals of Physics" data-faculty="Mr. Muhammed Sakil Hussain"> Fundamentals of Physics
            </label>
            <label class="option-pill subject-pill" title="Bangladesh Studies">
              <input type="radio" name="subjectChoice" value="SSW-03141202" data-title="Bangladesh Studies" data-faculty="Mr. Abdullah Haris Pasha"> Bangladesh Studies
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Assignment Topic / Title</label>
          <input type="text" id="inTopic">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Course Title</label>
            <input type="text" id="inCourseTitle">
          </div>
          <div class="form-group">
            <label>Course Code</label>
            <input type="text" id="inCourseCode">
          </div>
        </div>

        <div class="form-group">
          <label>Faculty / Instructor Name</label>
          <input type="text" id="inFaculty">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="inStudentName">
          </div>
          <div class="form-group">
            <label>Student ID</label>
            <input type="text" id="inStudentID">
          </div>
        </div>

        <!-- BATCH & DATE -->
        <div class="form-row">
          <div class="form-group">
            <label>Batch</label>
            <div class="option-group">
              <label class="option-pill"><input type="radio" name="batchSeasonChoice" value="Fall-26" checked> Fall-26</label>
            </div>
          </div>
          <div class="form-group">
            <label>Submission Date</label>
            <input type="date" id="inDate">
          </div>
        </div>

        <div class="actions">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button type="button" id="downloadPngBtn" class="btn btn-primary">📸 PNG</button>
            <button type="button" id="downloadJpgBtn" class="btn btn-accent">🖼️ JPG</button>
          </div>
          <button type="button" id="downloadPdfBtn" class="btn btn-secondary">📄 PDF Document</button>
          <button type="button" onclick="window.print()" class="btn btn-outline">🖨️ Direct Print</button>
        </div>

      </form>
    </aside>

    <!-- Right Live Preview -->
    <main class="preview-stage">
      <div id="pageToRender" class="a4-page">
        
        <header class="univ-header">
          <img src="logo.jpeg" alt="NEUB Logo" class="univ-logo" id="previewLogo">
          <h1 class="univ-name">NORTH EAST UNIVERSITY BANGLADESH</h1>
          <p class="univ-location"><b>Sylhet, Bangladesh</b></p>
          <h3 class="univ-dept" id="outDepartmentHeader">Department of CSE</h3>
        </header>

        <div class="topic-section">
          <div class="decor-line top"></div>
          <h2 id="outTopic" class="topic-title"></h2>
          <div class="decor-line bottom"></div>
        </div>

        <div class="info-grid">
          <div class="info-row"><span class="info-label">Student Name:</span><span class="info-value" id="outStudentName"></span></div>
          <div class="info-row"><span class="info-label">Student ID:</span><span class="info-value" id="outStudentID"></span></div>
          <div class="info-row"><span class="info-label">Course Title:</span><span class="info-value" id="outCourseTitle"></span></div>
          <div class="info-row"><span class="info-label">Course Code:</span><span class="info-value" id="outCourseCode"></span></div>
          <div class="info-row"><span class="info-label">Faculty:</span><span class="info-value" id="outFaculty"></span></div>
          <div class="info-row"><span class="info-label">Department:</span><span class="info-value" id="outDepartment">CSE</span></div>
          <div class="info-row"><span class="info-label">Batch:</span><span class="info-value" id="outBatch">Fall-26</span></div>
          <div class="info-row"><span class="info-label">Submission Date:</span><span class="info-value" id="outDate"></span></div>
        </div>

        <footer class="sheet-footer">
          <div class="footer-bar"></div>
        </footer>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      let toastTimeout;
      function showToast(title, message, type = "success") {
        const toast = document.getElementById('toast');
        const toastTitle = document.getElementById('toastTitle');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');
        const toastProgress = document.getElementById('toastProgress');
        
        toastTitle.innerText = title; toastMsg.innerText = message;
        toastProgress.style.animation = 'none'; toastProgress.offsetHeight; 
        
        if (type === "success") {
          toastIcon.innerText = "✅"; toast.style.borderLeftColor = "#10b981"; toastProgress.style.background = "#10b981";
        } else if (type === "loading") {
          toastIcon.innerText = "⏳"; toast.style.borderLeftColor = "#6366f1"; toastProgress.style.background = "#6366f1";
        } else {
          toastIcon.innerText = "❌"; toast.style.borderLeftColor = "#ef4444"; toastProgress.style.background = "#ef4444";
        }

        toast.classList.add('show');
        
        if(type !== "loading") {
          toastProgress.style.animation = 'toastProgress 3.5s linear forwards';
          clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3500);
        } else {
          toastProgress.style.width = '100%';
        }
      }

      function hideToast() { document.getElementById('toast').classList.remove('show'); }

      const textFields = [
        { inId: 'inTopic', outId: 'outTopic' },
        { inId: 'inStudentName', outId: 'outStudentName' },
        { inId: 'inStudentID', outId: 'outStudentID' },
        { inId: 'inCourseTitle', outId: 'outCourseTitle' },
        { inId: 'inCourseCode', outId: 'outCourseCode' },
        { inId: 'inFaculty', outId: 'outFaculty' }
      ];

      const bdDateOptions = { timeZone: 'Asia/Dhaka' };
      const bdYear = new Intl.DateTimeFormat('en-US', { ...bdDateOptions, year: 'numeric' }).format(new Date());
      const bdMonth = new Intl.DateTimeFormat('en-US', { ...bdDateOptions, month: '2-digit' }).format(new Date());
      const bdDay = new Intl.DateTimeFormat('en-US', { ...bdDateOptions, day: '2-digit' }).format(new Date());
      
      const todayISO = `${bdYear}-${bdMonth}-${bdDay}`;
      const dateInput = document.getElementById('inDate');
      dateInput.value = todayISO;

      function updatePreviewDate(dateString) {
        if(!dateString) return;
        const d = new Date(dateString);
        if (!isNaN(d)) {
          const prettyDate = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }).format(d);
          document.getElementById('outDate').innerText = prettyDate;
        } else {
          document.getElementById('outDate').innerText = dateString;
        }
      }
      
      updatePreviewDate(todayISO);
      dateInput.addEventListener('change', (e) => updatePreviewDate(e.target.value));

      textFields.forEach(({ inId, outId }) => {
        const inputElem = document.getElementById(inId);
        const outElem = document.getElementById(outId);
        if (inputElem && outElem) {
          inputElem.addEventListener('input', (e) => {
            outElem.innerText = e.target.value;
          });
        }
      });

      document.querySelectorAll('input[name="subjectChoice"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          if (e.target.checked) {
            const courseCode = e.target.value;
            const courseTitle = e.target.getAttribute('data-title');
            const facultyName = e.target.getAttribute('data-faculty');

            document.getElementById('inCourseCode').value = courseCode;
            document.getElementById('inCourseTitle').value = courseTitle;
            document.getElementById('inFaculty').value = facultyName;

            document.getElementById('outCourseCode').innerText = courseCode;
            document.getElementById('outCourseTitle').innerText = courseTitle;
            document.getElementById('outFaculty').innerText = facultyName;

            showToast("Auto-Filled!", "Subject details loaded magically. ✨", "success");
          }
        });
      });

      function updateDepartment() {
        const selected = document.querySelector('input[name="deptChoice"]:checked');
        if (selected) {
          document.getElementById('outDepartment').innerText = selected.value;
          document.getElementById('outDepartmentHeader').innerText = "Department of " + selected.value;
        }
      }
      document.querySelectorAll('input[name="deptChoice"]').forEach(el => el.addEventListener('change', updateDepartment));

      function updateBatch() {
        const selectedSeason = document.querySelector('input[name="batchSeasonChoice"]:checked');
        let season = selectedSeason ? selectedSeason.value : '';
        document.getElementById('outBatch').innerText = season;
      }
      document.querySelectorAll('input[name="batchSeasonChoice"]').forEach(el => el.addEventListener('change', updateBatch));
      
      updateDepartment();
      updateBatch();

      async function capturePage(scaleMultiplier = 3) {
        window.scrollTo(0, 0);
        const pageElement = document.getElementById('pageToRender');
        const originalTransform = pageElement.style.transform;
        pageElement.style.transform = 'none';

        try {
          const canvas = await html2canvas(pageElement, {
            scale: scaleMultiplier, useCORS: true, allowTaint: false, logging: false, backgroundColor: '#ffffff'
          });
          return canvas;
        } finally {
          pageElement.style.transform = originalTransform; 
        }
      }

      async function handleDownload(format) {
        const btnId = format === 'PDF' ? 'downloadPdfBtn' : (format === 'PNG' ? 'downloadPngBtn' : 'downloadJpgBtn');
        const btn = document.getElementById(btnId);
        const originalText = btn.innerHTML;
        const stdId = document.getElementById('inStudentID').value.trim() || 'Assignment';
        
        btn.innerHTML = '⏳ Processing...'; btn.disabled = true;
        showToast("Processing...", `Generating your ${format} file...`, "loading");

        try {
          const canvas = await capturePage(3);

          if (format === 'PDF') {
            const { jsPDF } = window.jspdf;
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            
            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(`NEUB_Cover_${stdId}.pdf`);

          } else {
            const link = document.createElement('a');
            link.download = `NEUB_Cover_${stdId}.${format.toLowerCase()}`;
            link.href = canvas.toDataURL(`image/${format.toLowerCase() === 'jpg' ? 'jpeg' : 'png'}`, 1.0);
            link.click();
          }

          hideToast(); setTimeout(() => showToast("Success!", `File Downloaded Successfully! 🚀`, "success"), 200);
        } catch (err) {
          console.error(`${format} Error:`, err); hideToast();
          setTimeout(() => showToast("Error!", `Failed to generate document. Ensure local server is running.`, "error"), 200);
        } finally {
          btn.innerHTML = originalText; btn.disabled = false;
        }
      }

      document.getElementById('downloadPngBtn').addEventListener('click', () => handleDownload('PNG'));
      document.getElementById('downloadJpgBtn').addEventListener('click', () => handleDownload('JPG'));
      document.getElementById('downloadPdfBtn').addEventListener('click', () => handleDownload('PDF'));

    });
  </script>
</body>
</html>
